[package]
name = "irokle-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Separate workspace: the fuzzers need nightly, the library stays on its pinned toolchain.
[workspace]

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
bytes = "1.12.1"
irokle = { path = ".." }
libfuzzer-sys = "0.4"
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
debug = 1

[[bin]]
name = "wire"
path = "fuzz_targets/wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "admission"
path = "fuzz_targets/admission.rs"
test = false
doc = false
bench = false

[[bin]]
name = "convergence"
path = "fuzz_targets/convergence.rs"
test = false
doc = false
bench = false
