[package]
name = "irokle"
version = "0.3.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
description = "Signed Merkle-DAG operation log for invite-only topics"

[workspace]
members = [".", "irokle-derive"]
resolver = "3"

[features]
default = []
fjall = ["dep:fjall", "dep:fs4"]
iroh = ["dep:iroh", "dep:tokio"]

# Ed25519 verification dominates sync tests in debug builds (~15 ms per op
# instead of ~40 µs); optimize the crypto crates so test timings reflect
# protocol behavior.
[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[dependencies]
blake3 = "1.8.7"
bytes = { version = "1.12.1", features = ["serde"] }
ed25519-dalek = { version = "3.0.0", features = ["serde"] }
fjall = { version = "3.1.10", optional = true }
fs4 = { version = "1.1.0", default-features = false, optional = true }
getrandom = "0.4.3"
iroh = { version = "1.2.0", optional = true }
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
smallvec = "1.16.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
], optional = true }
tracing = "0.1.44"
irokle-derive = { path = "irokle-derive", version = "=0.1.0" }

[dev-dependencies]
ctor = "1.0.13"
futures = "0.3.34"
patchbay = "0.7.0"
tempfile = "3.27.0"

[[example]]
name = "iroh_chat"
path = "examples/iroh/chat.rs"
required-features = ["iroh"]

[[example]]
name = "iroh_topic_intro"
path = "examples/iroh/topic_intro.rs"
required-features = ["iroh"]

[[example]]
name = "iroh_fjall_recovery"
path = "examples/iroh/fjall_recovery.rs"
required-features = ["iroh", "fjall"]

[[example]]
name = "iroh_runtime_config"
path = "examples/iroh/runtime_config.rs"
required-features = ["iroh"]

[[test]]
name = "iroh_patchbay_sync"
path = "tests/iroh_patchbay_sync/main.rs"
